# Tesseract configuration for iPSC simulator
# This will be used when building the Docker container

name: ipsc-culture-simulator
version: "1.0.0"
description: "Differentiable iPSC culture simulator with continuous passaging logic"

# Python runtime configuration
runtime:
  type: python
  version: "3.12"

# Entry point for the simulator
# (This will be configured properly when building the Docker image)
entrypoint: main.py

# Dependencies
dependencies:
  - jax>=0.9.0
  - diffrax
  - sbmltoodejax
  - numpy
  - tesseract-core

# Simulator inputs
inputs:
  threshold:
    type: float
    description: "Target confluency for passaging (0.0 - 1.0)"
    default: 0.7
    min: 0.0
    max: 1.0

  feed_rate:
    type: float
    description: "Continuous nutrient replenishment rate"
    default: 0.1
    min: 0.0
    max: 1.0

# Simulator outputs
outputs:
  loss:
    type: float
    description: "Optimization objective: -(yield) + penalty*(differentiation)"

  gradients:
    type: object
    description: "Partial derivatives of loss w.r.t. inputs"
    properties:
      threshold:
        type: float
      feed_rate:
        type: float

  final_state:
    type: array
    description: "Final state [S, D, N, Y]"
    items:
      type: float

# Resource requirements
resources:
  cpu: 2
  memory: "4Gi"
